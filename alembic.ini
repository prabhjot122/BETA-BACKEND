# A generic Alembic configuration file.
[alembic]
# path to migration scripts
script_location = alembic

# Template for new migration files
# file_template = %%(rev)s_%%(slug)s

# Logging configuration file
# logging_config_file = my_logging_config.ini

# Corrected database connection URL.
# This must match your docker-compose environment.
sqlalchemy.url = mysql+pymysql://lawuser:lawpass123@db:3306/lawvriksh_referral

# =============================================================================
# Logging Configuration
# This section is required by the default env.py script.
# =============================================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S